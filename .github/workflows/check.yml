# SEO integrity gate: catches by-hand edits that reintroduce the failure
# modes the Aug 2026 Search Console audit dug out (internal .html links,
# orphaned posts, sitemap rot). The weekly blog workflow runs the same script
# before the bot commits; this one covers everything else that touches main.
name: Site integrity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify site integrity
        run: python scripts/check_site.py

name: Generate Blog Post

on:
  schedule:
    # Every Monday at 9 AM Eastern (1 PM UTC in summer / 2 PM UTC in winter)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    # Also triggerable manually from the Actions tab — useful for testing

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the new post commit
      issues: write     # needed to open an issue when the run fails

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate blog post
        env:
          # Free Gemini key (owner: no paid API). Add it once as a repo secret named GEMINI_API_KEY.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_blog.py

      # Refuse to publish a broken state: .html internal links, an orphaned
      # post, or a rotten sitemap fail the run here, before anything deploys.
      - name: Verify site integrity
        run: python scripts/check_site.py

      - name: Commit and push
        run: |
          git config user.name  "St. Clair Blog Bot"
          git config user.email "bot@stclairdrugmart.ca"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            TITLE=$(python3 -c "
          import json, pathlib
          posts = json.loads(pathlib.Path('blog/posts.json').read_text())
          print(posts[-1]['title'])
          ")
            git commit -m "Blog: ${TITLE}"
            git push
          fi

      # The bot failed silently every Monday from Jun 22 to Aug 3, 2026 (retired
      # Gemini model) and nobody noticed until a Search Console audit. Never
      # again: a failed run opens/refreshes a GitHub issue the owner will see.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Blog bot failed: $(date -u +%Y-%m-%d)"
          BODY="The weekly blog workflow failed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If this is the Gemini model chain 404ing again, update GEMINI_MODELS in scripts/generate_blog.py."
          EXISTING=$(gh issue list --state open --search "Blog bot failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug || gh issue create --title "$TITLE" --body "$BODY"
          fi
